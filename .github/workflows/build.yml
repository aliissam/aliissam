name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinImageCapture.sln

      - name: Build
        run: dotnet build WinImageCapture.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/WinImageCapture.Core.Tests/WinImageCapture.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish app
        run: dotnet publish src/WinImageCapture.App/WinImageCapture.App.csproj -c Release -r win-x64 --self-contained false -o publish/WinImageCapture

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinImageCapture-win-x64
          path: publish/WinImageCapture
